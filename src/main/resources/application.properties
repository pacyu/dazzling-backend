spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_URL}/${SPRING_DATASOURCE_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.security.user.name=${SECURITY_NAME}
spring.security.user.password=${SECURITY_PASSWORD}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
blog.notify.email=${DAZZLING_NOTIFY_EMAIL}
blog.notify.name=${SPRING_DATASOURCE_USERNAME}
pollinations.ai.key=${POLLEN_API_KEY}
pollinations.ai.prompt=A 1990s retro anime style screenshot. A beautiful female, masterpiece, 90s OVA aesthetic.

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
# spring.thymeleaf.prefix=classpath:/templates/
spring.security.user.role=Admin
spring.servlet.multipart.max-file-size=4096KB
spring.servlet.multipart.max-request-size=4096KB
server.tomcat.remote_ip_header=x-forwarded-for
server.tomcat.protocol_header=x-forwarded-proto
server.tomcat.port-header=X-Forwarded-Port
server.use-forward-headers=true
server.address=0.0.0.0
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.protocol=smtp
spring.mail.defaultEncoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
file.upload.avatarPath=blog/images/avatars/
file.upload.coverPath=blog/images/covers/
file.upload.path=blog/resources/
# file.upload.path=/home/www/resources/static/blog/images/
logging.file.path=logs
logging.file.name=logs/blog.log
logging.level.root=INFO
logging.level.com.dazzling.blog=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.csrf=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n